name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install report dependencies
        run: python -m pip install openpyxl python-dotenv snowflake-connector-python

      - name: Check Python syntax
        run: python -m py_compile BatteryAlerts.py utils/config.py

      - name: Smoke-test CLI
        run: python BatteryAlerts.py --help
